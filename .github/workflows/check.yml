name: Check

on: push

# TODO: We should later enable prettier and eslint; for now, we just build.

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v7
        - name: Set up Node.js
          uses: actions/setup-node@v7
          with:
            node-version: 24
        - name: Install dependencies
          run: npm ci
        - name: Run build
          run: npm run build