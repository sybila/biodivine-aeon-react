appId: com.biodivine.aeon
productName: Biodivine-Aeon
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

asar: true

directories:
  output: release
  buildResources: build

files:
  - dist-el/**/*
  - package.json

extraResources:
  - from: electron/icons
    to: icons

linux:
  syncDesktopName: true
  target:
    - AppImage
  category: Science
  icon: electron/icons/linux-icons
  extraResources:
    - from: electron/compute-engine-binaries/linux
      to: compute-engine

win:
  target:
    - target: portable
      arch:
        - x64
  icon: electron/icons/Aeon-windows-icon.ico
  extraResources:
    - from: electron/compute-engine-binaries/windows
      to: compute-engine

mac:
  target:
    - target: dmg
      arch: arm64
  icon: electron/icons/Aeon-mac-icon.icns
  extraResources:
    - from: electron/compute-engine-binaries/mac
      to: compute-engine