appId: com.biodivine.aeon
productName: Biodivine-Aeon
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

asar: true

directories:
  output: release
  buildResources: build

files:
  - dist-el/**/*
  - package.json

extraResources:
  - from: electron/icons
    to: icons

linux:
  syncDesktopName: true
  target:
    - AppImage
  category: Science
  icon: electron/icons/linux-icons

win:
  target:
    - target: portable
      arch:
        - x64
  icon: electron/icons/Aeon-windows-icon.ico

mac:
  target:
    - target: dmg
      arch: arm64
  icon: electron/icons/Aeon-mac-icon.icns